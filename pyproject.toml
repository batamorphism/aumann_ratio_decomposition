[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aumann_ratio_decomposition"
version = "0.1.0"
description = "Aumann-Shapley ratio decomposition utilities."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "matplotlib>=3.5",
  "seaborn>=0.12",
  "pysubgroup>=0.7",
  "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aumann_ratio_decomposition*"]
